<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NH RepDex — New Hampshire Representative Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --rep: #1a472a;
    --dem: #0d2b6b;
    --ind: #5a2d82;
    --gold: #f5c518;
    --silver: #c0c0c0;
    --bg: #0a0a14;
    --card-w: 300px;
    --cols: 3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: #eee;
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Pixel grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px 20px;
    background: linear-gradient(180deg, #0a0a14 0%, transparent 100%);
  }

  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(16px, 4vw, 32px);
    letter-spacing: 2px;
    background: linear-gradient(135deg, #f5c518, #ff6b35, #f5c518);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(245,197,24,0.4));
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: #888;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .stat-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-pill .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-r { background: #e53935; box-shadow: 0 0 6px #e53935; }
  .dot-d { background: #1e88e5; box-shadow: 0 0 6px #1e88e5; }
  .dot-i { background: #ab47bc; box-shadow: 0 0 6px #ab47bc; }

  /* Controls */
  .controls {
    position: relative;
    z-index: 10;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px 28px;
  }

  .controls input[type="text"] {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #eee;
    padding: 10px 16px;
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    width: 240px;
    outline: none;
    transition: border-color .2s;
  }
  .controls input[type="text"]::placeholder { color: #555; }
  .controls input[type="text"]:focus { border-color: var(--gold); }

  .filter-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #aaa;
    padding: 10px 18px;
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .filter-btn:hover { background: rgba(255,255,255,0.12); color: #eee; }
  .filter-btn.active { color: #fff; }
  .filter-btn.active.all { border-color: var(--gold); background: rgba(245,197,24,0.12); color: var(--gold); }
  .filter-btn.active.rep { border-color: #e53935; background: rgba(229,57,53,0.12); color: #ef5350; }
  .filter-btn.active.dem { border-color: #1e88e5; background: rgba(30,136,229,0.12); color: #42a5f5; }

  /* Grid */
  #card-grid {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--card-w));
    gap: 40px;
    justify-content: center;
    padding: 0 36px 60px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1050px) {
    :root { --cols: 2; }
  }
  @media (max-width: 700px) {
    :root { --cols: 1; }
  }

  .col-toggle {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .col-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #888;
    padding: 8px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .5px;
  }
  .col-btn:hover { background: rgba(255,255,255,0.1); color: #ccc; }
  .col-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(245,197,24,0.1); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* THE CARD */
  .rep-card {
    width: var(--card-w);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    transition: box-shadow 0.3s ease;
  }

  .card-scene:not(:has(.flipped)) .card-front.rep-card {
    cursor: pointer;
  }

  .card-scene:not(:has(.flipped)):hover .card-front.rep-card {
    transform: translateY(-6px) scale(1.02) rotate(-0.3deg);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }

  /* Party-based card themes */
  .rep-card.REP {
    box-shadow: 0 4px 30px rgba(229,57,53,0.25), 0 0 0 1px rgba(229,57,53,0.3);
    --party-a: #7b1212;
    --party-b: #1a0505;
    --party-c: #e53935;
    --party-d: #ff6b6b;
    --type-bg: rgba(229,57,53,0.25);
  }
  .rep-card.DEM {
    box-shadow: 0 4px 30px rgba(30,136,229,0.25), 0 0 0 1px rgba(30,136,229,0.3);
    --party-a: #0a2752;
    --party-b: #030d1e;
    --party-c: #1e88e5;
    --party-d: #64b5f6;
    --type-bg: rgba(30,136,229,0.25);
  }
  .rep-card.IND {
    box-shadow: 0 4px 30px rgba(171,71,188,0.25), 0 0 0 1px rgba(171,71,188,0.3);
    --party-a: #3b1260;
    --party-b: #0e0520;
    --party-c: #ab47bc;
    --party-d: #ce93d8;
    --type-bg: rgba(171,71,188,0.25);
  }

  .rep-card:hover {
    box-shadow: 0 16px 50px color-mix(in srgb, var(--party-c) 40%, transparent), 0 0 0 1.5px var(--party-c);
  }

  /* Holographic shimmer on hover */
  .rep-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 40%,
      rgba(255,255,255,0.08) 50%,
      transparent 60%
    );
    opacity: 0;
    transition: opacity .3s, background-position .3s;
    pointer-events: none;
    border-radius: 16px;
  }
  .rep-card:hover::after { opacity: 1; }

  .card-inner {
    background: linear-gradient(160deg, var(--party-a), var(--party-b));
    height: 100%;
  }

  /* Card Header */
  .card-header {
    padding: 14px 14px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-name {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: .5px;
    line-height: 1.3;
    color: #fff;
    flex: 1;
    padding-right: 8px;
  }

  .card-hp {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--party-d);
    white-space: nowrap;
    padding-top: 2px;
  }
  .card-hp span {
    font-size: 12px;
  }

  /* Avatar area */
  .card-art {
    position: relative;
    margin: 0 14px 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(0,0,0,0.2));
    border: 1px solid rgba(255,255,255,0.1);
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-art .rep-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .card-art .photo-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  /* Pixel avatar */
  .pixel-avatar {
    width: 90px;
    height: 90px;
    position: relative;
    image-rendering: pixelated;
  }

  .pixel-avatar canvas {
    width: 90px;
    height: 90px;
    image-rendering: pixelated;
  }

  .card-art .district-badge {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: rgba(255,255,255,0.5);
  }

  /* Type badges */
  .type-row {
    display: flex;
    gap: 6px;
    padding: 0 14px 10px;
    flex-wrap: wrap;
  }

  .type-badge {
    background: var(--type-bg);
    border: 1px solid var(--party-c);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--party-d);
  }

  .type-badge.county {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
    color: #bbb;
  }

  /* Stats */
  .card-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--party-c), transparent);
    margin: 0 14px 10px;
    opacity: 0.4;
  }

  .card-stats {
    padding: 0 14px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .stat-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #666;
    font-weight: 700;
  }

  .stat-bar-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stat-bar {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--party-c), var(--party-d));
    transition: width .6s ease;
  }

  .stat-val {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--party-d);
    min-width: 20px;
    text-align: right;
  }

  /* Move / ability */
  .card-move {
    margin: 0 14px 14px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 8px 10px;
    border-left: 3px solid var(--party-c);
  }

  .move-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--party-d);
    margin-bottom: 4px;
  }

  .move-desc {
    font-size: 9px;
    color: #999;
    line-height: 1.5;
  }

  /* Footer */
  .card-footer {
    padding: 8px 14px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .card-id {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #444;
  }

  .rarity-stars {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* Loading state */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    transition: opacity .5s ease;
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .pokeball-spin {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 4px solid transparent;
    border-top-color: var(--gold);
    border-right-color: var(--gold);
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--gold);
    animation: blink 1s ease infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Pagination */
  .pagination {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 20px 30px;
    flex-wrap: wrap;
  }

  .page-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #aaa;
    padding: 8px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    cursor: pointer;
    transition: all .2s;
  }

  .page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); color: #eee; }
  .page-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(245,197,24,0.1); }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page-info {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: #555;
    text-align: center;
    padding: 0 5px;
  }

  .no-results {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #444;
    text-align: center;
    padding: 80px 20px;
    width: 100%;
  }

  /* ── CARD FLIP ── */
  .card-scene {
    width: 100%;
    max-width: var(--card-w);
    perspective: 900px;
    justify-self: center;
  }

  .card-flipper {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(.4,0,.2,1);
  }

  .card-flipper.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    overflow: hidden;
  }

  .card-face.card-back {
    position: absolute;
    top: 0; left: 0; width: 100%;
    transform: rotateY(180deg);
    min-height: 100%;
  }

  /* flip button on the front card */
  .flip-btn {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: none;
    border-top: 1px solid rgba(255,255,255,0.07);
    color: var(--party-d);
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 9px 0;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .2s;
  }
  .flip-btn:hover { background: rgba(255,255,255,0.06); }

  /* ── BACK OF CARD ── */
  .back-inner {
    background: linear-gradient(160deg, var(--party-a, #0a1020), var(--party-b, #030810));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 30px color-mix(in srgb, var(--party-c, #555) 20%, transparent);
  }

  .back-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .back-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: var(--party-d, #aaa);
    letter-spacing: .5px;
  }

  .back-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #888;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 4px 8px;
    cursor: pointer;
    transition: all .2s;
  }
  .back-close:hover { color: #fff; background: rgba(255,255,255,0.12); }

  .ai-disclaimer {
    background: rgba(245,197,24,0.08);
    border: 1px solid rgba(245,197,24,0.25);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 8px;
    color: #a89040;
    line-height: 1.5;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }

  .vote-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }

  .vote-item {
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 8px 10px;
    border-left: 3px solid var(--vote-color, #555);
  }

  .vote-item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .vote-bill {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #666;
  }

  .vote-badge {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 2px 7px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--vote-color, #555) 20%, transparent);
    color: var(--vote-color, #888);
    border: 1px solid var(--vote-color, #555);
  }

  .vote-desc {
    font-size: 9px;
    color: #aaa;
    line-height: 1.4;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    padding: 8px 10px;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .contact-icon {
    font-size: 12px;
    flex-shrink: 0;
  }

  .contact-info {
    flex: 1;
    min-width: 0;
  }

  .contact-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 6px;
    color: #555;
    margin-bottom: 3px;
    letter-spacing: .5px;
  }

  .contact-value {
    font-size: 9px;
    color: #aaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .contact-value a {
    color: var(--party-d, #aaa);
    text-decoration: none;
  }

  .contact-value a:hover {
    text-decoration: underline;
  }

  .contact-na {
    color: #444;
    font-style: italic;
  }
    display: block;
    text-align: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #888;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 9px;
    text-decoration: none;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .records-link:hover { background: rgba(255,255,255,0.1); color: #eee; border-color: var(--party-c); }

  /* Loading state for back */
  .back-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 14px;
  }

  .back-loading-spinner {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.07);
    border-top-color: var(--party-c, #aaa);
    animation: spin 0.8s linear infinite;
  }

  .back-loading-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    color: #555;
    animation: blink 1s ease infinite;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="pokeball-spin"></div>
  <div class="loading-text">LOADING REPDEX...</div>
</div>

<header>
  <div class="logo">✦ NH RepDex ✦</div>
  <div class="subtitle">New Hampshire State Representatives · 2025–2026 Session</div>
  <div class="stats-bar">
    <div class="stat-pill"><span class="dot dot-r"></span><span id="rep-count">—</span> Republican</div>
    <div class="stat-pill"><span class="dot dot-d"></span><span id="dem-count">—</span> Democrat</div>
    <div class="stat-pill"><span class="dot dot-i"></span><span id="ind-count">—</span> Independent</div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search name, county, district…">
  <button class="filter-btn active all" data-filter="ALL">All</button>
  <button class="filter-btn rep" data-filter="REP">Republican</button>
  <button class="filter-btn dem" data-filter="DEM">Democrat</button>
  <button class="filter-btn ind" data-filter="IND">Independent</button>
  <div class="col-toggle">
    <button class="col-btn" data-cols="2">2 cols</button>
    <button class="col-btn active" data-cols="3">3 cols</button>
  </div>
</div>

<div id="card-grid"></div>
<div class="pagination" id="pagination"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
// NH House Representatives 2025-2026 (400 members)
// Data: name, party (REP/DEM/IND), county, district
const REPS = [

// ── PIXEL AVATAR GENERATOR ───────────────────────────────────────────────────
function generatePixelAvatar(name, party) {
  const canvas = document.createElement('canvas');
  canvas.width = 16; canvas.height = 16;
  const ctx = canvas.getContext('2d');

  // Seed from name
  let seed = 0;
  for (let i = 0; i < name.length; i++) seed = (seed * 31 + name.charCodeAt(i)) & 0xffffffff;
  const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };

  const colors = {
    REP: ['#e53935','#c62828','#ff8a80','#fff','#ffcdd2','#b71c1c','#4a1515'],
    DEM: ['#1e88e5','#1565c0','#90caf9','#fff','#bbdefb','#0d47a1','#0a1f3d'],
    IND: ['#ab47bc','#7b1fa2','#ce93d8','#fff','#e1bee7','#4a148c','#1e0530'],
  };
  const pal = colors[party] || colors.IND;

  // Draw a simple 16x16 character (mirrored for symmetry)
  const pixels = [];
  for (let y = 0; y < 16; y++) {
    pixels[y] = [];
    for (let x = 0; x < 8; x++) {
      pixels[y][x] = Math.floor(rng() * pal.length);
    }
  }

  // Override head and body areas with structure
  // Head: rows 2-6, cols 3-5
  for (let y = 2; y <= 5; y++) for (let x = 3; x <= 5; x++) pixels[y][x] = Math.floor(rng() * 2) + 2;
  // Eyes
  pixels[3][4] = 3; pixels[3][3] = 3;
  // Body: rows 7-11
  for (let y = 7; y <= 11; y++) for (let x = 2; x <= 6; x++) pixels[y][x] = Math.floor(rng() * 2);
  // Legs
  for (let y = 12; y <= 15; y++) { pixels[y][3] = 0; pixels[y][4] = 6; }

  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 8; x++) {
      ctx.fillStyle = pal[pixels[y][x]];
      ctx.fillRect(x, y, 1, 1);
      ctx.fillRect(15 - x, y, 1, 1);
    }
  }

  return canvas;
}

// ── STATS GENERATOR ──────────────────────────────────────────────────────────
function getStats(name, party) {
  let seed = 0;
  for (let c of name) seed = (seed * 31 + c.charCodeAt(0)) & 0xffffffff;
  const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
  const base = () => Math.floor(rng() * 60) + 30;
  return [
    { label: 'Debate', val: base() },
    { label: 'Sponsor', val: base() },
    { label: 'Attend', val: base() },
    { label: 'Lobby', val: base() },
  ];
}

function getMove(name, party) {
  let seed = 0;
  for (let c of name) seed = (seed * 17 + c.charCodeAt(0)) & 0xffffffff;
  const rng = () => { seed ^= (seed << 13); seed ^= (seed >> 17); seed ^= (seed << 5); return (seed >>> 0) / 0xffffffff; };

  const moves = {
    REP: [
      {name:"FISCAL CUT", desc:"Reduces government spending by 2 stages."},
      {name:"TAX RELIEF", desc:"Boosts constituent HP with a targeted cut."},
      {name:"FREE MARKET", desc:"Deregulation attack hits all agencies at once."},
      {name:"BORDER WALL", desc:"Raises a barrier that prevents status effects."},
      {name:"SECOND AMEND.", desc:"Critical hit move with high variance."},
    ],
    DEM: [
      {name:"SOCIAL SAFETY NET", desc:"Restores HP to all allies in the district."},
      {name:"GREEN NEW DEAL", desc:"Charges a solar-powered blast over 2 turns."},
      {name:"HEALTHCARE ACCESS", desc:"Removes one negative status from the team."},
      {name:"UNION STRIKE", desc:"Collective power — grows stronger in groups."},
      {name:"EQUITY SHIELD", desc:"Absorbs the next super-effective attack."},
    ],
    IND: [
      {name:"WILDCARD", desc:"Effect changes every session. Unpredictable!"},
      {name:"CROSSOVER VOTE", desc:"Can be used with either party's moves."},
    ],
  };
  const pool = moves[party] || moves.IND;
  return pool[Math.floor(rng() * pool.length)];
}

function getRarity(name) {
  let h = 0;
  for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  const r = (h >>> 0) % 100;
  if (r < 5) return '★★★';
  if (r < 25) return '★★';
  return '★';
}

// ── AI VOTING FETCH ───────────────────────────────────────────────────────────
const voteCache = {};

async function fetchVotingProfile(rep) {
  const key = rep.n;
  if (voteCache[key]) return voteCache[key];

  const partyLabel = rep.p === 'REP' ? 'Republican' : rep.p === 'DEM' ? 'Democrat' : 'Independent';
  const prompt = `You are generating a fun, Pokémon card-style fictional voting history for a New Hampshire state representative. Generate 4 mock legislative votes for ${rep.n}, a ${partyLabel} from ${rep.c} County (${rep.d}).

Each vote should feel realistic for a NH state rep of this party. Use actual NH policy areas like: property taxes, school vouchers, gun rights, Medicaid expansion, renewable energy, zoning, opioid treatment, minimum wage, etc.

Respond ONLY with a valid JSON array of exactly 4 objects. No preamble, no markdown. Each object must have:
- "bill": short bill code like "HB 1234"
- "topic": 3-5 word topic name in ALL CAPS
- "vote": either "YEA" or "NAY"
- "desc": one sentence (max 12 words) describing what the bill does

Example: [{"bill":"HB 101","topic":"SCHOOL CHOICE VOUCHERS","vote":"YEA","desc":"Allows public funds to pay for private school tuition."}]`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await response.json();
  const raw = data.content.map(b => b.text || '').join('');
  const clean = raw.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  voteCache[key] = parsed;
  return parsed;
}

// ── WIKIPEDIA PHOTO FETCH ─────────────────────────────────────────────────────
const photoCache = {};

async function fetchWikiPhoto(name) {
  if (photoCache[name] !== undefined) return photoCache[name];
  photoCache[name] = null; // mark as attempted
  try {
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`;
    const res = await fetch(url);
    if (!res.ok) { return null; }
    const data = await res.json();
    const thumb = data?.thumbnail?.source || data?.originalimage?.source || null;
    photoCache[name] = thumb;
    return thumb;
  } catch { return null; }
}

// Pre-fetch photos for the current page quietly in background
function prefetchPhotos(reps) {
  reps.forEach(r => {
    if (photoCache[r.n] === undefined) fetchWikiPhoto(r.n);
  });
}


function buildCard(rep, index) {
  const scene = document.createElement('div');
  scene.className = 'card-scene';
  scene.style.animation = `cardIn 0.4s ease ${(index % PER_PAGE) * 0.04}s backwards`;

  const stats = getStats(rep.n, rep.p);
  const move = getMove(rep.n, rep.p);
  const rarity = getRarity(rep.n);
  const totalHP = 40 + stats.reduce((a,b)=>a+b.val,0) / 4 | 0;
  const avatar = generatePixelAvatar(rep.n, rep.p);
  const partyLabel = rep.p === 'REP' ? 'Republican' : rep.p === 'DEM' ? 'Democrat' : 'Independent';
  const recordsUrl = `https://gc.nh.gov/bill_Status/byAnyMember.aspx?member=${encodeURIComponent(rep.n)}&SessionYear=2025&list=1`;

  scene.innerHTML = `
    <div class="card-flipper" id="flipper-${index}">
      <!-- FRONT -->
      <div class="card-face card-front rep-card ${rep.p}">
        <div class="card-inner">
          <div class="card-header">
            <div class="card-name">${rep.n}</div>
            <div class="card-hp"><span>${totalHP}</span> HP</div>
          </div>
          <div class="card-art" id="art-${index}">
            <div class="photo-fallback" id="fallback-${index}">
              <div class="pixel-avatar" id="av-${index}"></div>
            </div>
            <div class="district-badge">${rep.d}</div>
          </div>
          <div class="type-row">
            <span class="type-badge">${partyLabel}</span>
            <span class="type-badge county">${rep.c} Co.</span>
          </div>
          <div class="card-divider"></div>
          <div class="card-stats">
            ${stats.map(s => `
              <div class="stat-row">
                <div class="stat-label">${s.label}</div>
                <div class="stat-bar-wrap">
                  <div class="stat-bar"><div class="stat-bar-fill" style="width:${s.val}%"></div></div>
                  <div class="stat-val">${s.val}</div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="card-move">
            <div class="move-name">⚡ ${move.name}</div>
            <div class="move-desc">${move.desc}</div>
          </div>
          <div class="card-footer">
            <div class="card-id">#${String(index+1).padStart(3,'0')}</div>
            <div class="rarity-stars">${rarity}</div>
          </div>
          <button class="flip-btn" id="flipbtn-${index}">📋 VIEW VOTING RECORD ▶</button>
        </div>
      </div>

      <!-- BACK -->
      <div class="card-face card-back rep-card ${rep.p}" style="--party-a:var(--party-a);--party-b:var(--party-b);">
        <div class="back-inner" style="
          --party-a: ${rep.p==='REP'?'#3a0a0a':rep.p==='DEM'?'#051232':'#1a0535'};
          --party-b: ${rep.p==='REP'?'#0e0202':rep.p==='DEM'?'#010510':'#080215'};
          --party-c: ${rep.p==='REP'?'#e53935':rep.p==='DEM'?'#1e88e5':'#ab47bc'};
          --party-d: ${rep.p==='REP'?'#ff8a80':rep.p==='DEM'?'#90caf9':'#e1bee7'};
        ">
          <div class="back-header">
            <div class="back-title">🗳 VOTING RECORD</div>
            <button class="back-close" id="closebtn-${index}">✕ BACK</button>
          </div>
          <div class="back-title" style="font-size:8px;color:#aaa;font-family:'Exo 2',sans-serif;font-weight:700;">${rep.n}</div>
          <div class="ai-disclaimer">⚠ AI-simulated votes for illustration. Not real legislative data.</div>

              <div class="contact-label">EMAIL</div>

          return `
            <div class="vote-item" style="--vote-color:${col}">
              <div class="vote-item-top">
                <span class="vote-bill">${v.bill} · ${v.topic}</span>
                <span class="vote-badge" style="--vote-color:${col}">${v.vote}</span>
              </div>
              <div class="vote-desc">${v.desc}</div>
            </div>
          `;
        }).join('');
      } catch(e) {
        voteSlot.innerHTML = `<div style="font-size:9px;color:#666;text-align:center;padding:20px;">Could not load votes.<br>Check your connection.</div>`;
      }
    }
  });

  // Flip back to front
  scene.querySelector(`#closebtn-${index}`).addEventListener('click', () => {
    scene.querySelector(`#flipper-${index}`).classList.remove('flipped');
  });

  // Attach pixel avatar as fallback
  setTimeout(() => {
    const slot = scene.querySelector(`#av-${index}`);
    if (slot) slot.appendChild(avatar);
  }, 0);

  // Try Wikipedia photo — swap in over pixel art if found
  fetchWikiPhoto(rep.n).then(photoUrl => {
    if (!photoUrl) return;
    const fallback = scene.querySelector(`#fallback-${index}`);
    if (!fallback) return;
    const img = document.createElement('img');
    img.className = 'rep-photo';
    img.alt = rep.n;
    img.src = photoUrl;
    img.onload = () => fallback.replaceWith(img);
  });

  return scene;
}

// ── PAGINATION & FILTERING ───────────────────────────────────────────────────
const PER_PAGE = 30;
let currentPage = 1;
let currentFilter = 'ALL';
let currentSearch = '';

function getFiltered() {
  return REPS.filter(r => {
    const matchParty = currentFilter === 'ALL' || r.p === currentFilter;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q || r.n.toLowerCase().includes(q) || r.c.toLowerCase().includes(q) || r.d.toLowerCase().includes(q);
    return matchParty && matchSearch;
  });
}

function render() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / PER_PAGE);
  if (currentPage > totalPages) currentPage = Math.max(1, totalPages);

  const start = (currentPage - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);

  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  if (slice.length === 0) {
    grid.innerHTML = '<div class="no-results">NO REPS FOUND<br><br>TRY A DIFFERENT SEARCH</div>';
  } else {
    slice.forEach((rep, i) => grid.appendChild(buildCard(rep, start + i)));
    prefetchPhotos(slice);
  }

  renderPagination(totalPages, total);
}

function renderPagination(totalPages, total) {
  const pg = document.getElementById('pagination');
  if (totalPages <= 1) { pg.innerHTML = ''; return; }

  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">◀ PREV</button>`;

  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += `<button class="page-btn" onclick="goPage(1)">1</button>${start>2?'<span class="page-info">…</span>':''}`;
  for (let p = start; p <= end; p++) {
    html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  if (end < totalPages) html += `${end<totalPages-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;

  html += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">NEXT ▶</button>`;
  html += `<div class="page-info">${total} reps</div>`;
  pg.innerHTML = html;
}

window.goPage = (p) => { currentPage = p; render(); window.scrollTo({top:0,behavior:'smooth'}); };

// Update counts
const repCount = REPS.filter(r=>r.p==='REP').length;
const demCount = REPS.filter(r=>r.p==='DEM').length;
const indCount = REPS.filter(r=>r.p==='IND').length;
document.getElementById('rep-count').textContent = repCount;
document.getElementById('dem-count').textContent = demCount;
document.getElementById('ind-count').textContent = indCount;

// Column toggle
document.querySelectorAll('.col-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const cols = parseInt(btn.dataset.cols);
    document.documentElement.style.setProperty('--cols', cols);
    document.querySelectorAll('.col-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    currentPage = 1;
    render();
  });
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value;
    currentPage = 1;
    render();
  }, 200);
});

// Init
window.addEventListener('load', () => {
  render();
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 600);
});
</script>
